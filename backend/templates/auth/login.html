
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre na sua conta List e organize suas listas.">
  <title>Entrar | List</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
  <main class="auth-page">
    <div class="auth-layout">
      <div class="auth-brand">
        <div class="brand-mark">✓</div>
        <div>
          <strong>List</strong>
          <span>Organize juntos</span>
        </div>
      </div>

      <section class="auth-card" aria-labelledby="loginTitle">
        <header class="auth-heading">
          <p class="eyebrow">Bem-vindo de volta</p>
          <h1 id="loginTitle">Entre na sua conta</h1>
          <p>Acesse suas listas e continue de onde parou.</p>
        </header>

        <form class="auth-form" id="loginForm">
          <div class="auth-field">
            <label for="loginUsername">Nome de usuário</label>
            <input
              type="text"
              id="loginUsername"
              name="username"
              placeholder="Digite seu usuário"
              autocomplete="username"
              required
            >
          </div>

          <div class="auth-field">
            <label for="loginPassword">Senha</label>
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <button class="auth-submit" id="loginButton" type="submit">
            Entrar
          </button>
        </form>

        <p class="auth-footer">
          Ainda não tem uma conta?
          <a href="{% url 'register_page' %}">Criar conta</a>
        </p>

        <p class="auth-notice" id="authNotice" aria-live="polite" role="status">
          Informe suas credenciais para entrar.
        </p>
      </section>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const authNotice = document.getElementById("authNotice");

    const TOKEN_KEY = "list_auth_token";

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!loginForm.reportValidity()) {
        return;
      }

      const username = document
        .getElementById("loginUsername")
        .value.trim();

      const password = document
        .getElementById("loginPassword")
        .value;

      loginButton.disabled = true;
      loginButton.textContent = "Entrando...";
      authNotice.textContent = "Validando suas credenciais...";

      try {
        const response = await fetch("/api/login/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.non_field_errors?.join(" ") ||
            data.detail ||
            "Usuário ou senha inválidos."
          );
        }

        if (typeof data.token !== "string" || !data.token.trim()) {
          throw new Error("A API não retornou um token de autenticação válido.");
        }

        // Armazena o token e o nome do usuário.
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem("list_username", username);

        // Redireciona para o dashboard.
        window.location.href = "/dashboard/";

        authNotice.textContent =
          "Login realizado com sucesso! Token armazenado.";

        // O redirecionamento será configurado quando confirmarmos
        // a rota Django que servirá o dashboard.
        
      } catch (error) {
        localStorage.removeItem(TOKEN_KEY);

        authNotice.textContent =
          error.message || "Não foi possível conectar ao servidor.";

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
